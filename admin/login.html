<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mwashi Gadgets | Admin Login</title>
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-auth">
<div class="auth-card">
    <img src="../images/logo.PNG" alt="Mwashi Gadgets" class="admin-logo">
    <h1>Admin Login</h1>
    <p>Manage Mwashi Gadgets products and prices.</p>
    <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" required placeholder="admin@example.com">
        <label>Password</label>
        <input id="password" type="password" required placeholder="••••••••">
        <button type="submit" class="primary-btn">Login</button>
    </form>
    <div id="loginMessage" class="message"></div>
<script>
if (new URLSearchParams(location.search).get("unauthorized") === "1") {
    document.getElementById("loginMessage").textContent =
        "This account is not authorized to access the admin area.";
}
</script>
    <a href="../index.html" class="back-link">← Back to store</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
const form=document.getElementById("loginForm");
const msg=document.getElementById("loginMessage");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 msg.textContent="Signing in...";
 try{
   const sb=requireSupabase();
   const {error}=await sb.auth.signInWithPassword({
     email:email.value.trim(),password:password.value
   });
   if(error) throw error;

   const isAdmin = await requireAdmin({ redirect: false });
   if (!isAdmin) {
     await sb.auth.signOut();
     throw new Error("This account is not authorized to access the Mwashi Gadgets admin area.");
   }

   location.href="index.html";
 }catch(err){msg.textContent=err.message;}
});
</script>
</body>
</html>
