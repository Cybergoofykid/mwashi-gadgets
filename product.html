<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Mwashi Gadgets</title>

    <link rel="icon" href="images/logo.PNG">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/logo.PNG"
                    alt="Mwashi Gadgets Logo"
                >

            </a>

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>

                <a href="cart.html">

                    🛒 Cart
                    (<span id="count">0</span>)

                </a>

            </li>

        </ul>

    </nav>

</header>


<main class="product-page">


    <!-- ===============================
         PRODUCT IMAGE
    ================================ -->

    <div class="product-main-image">

        <img
            id="productImage"
            src=""
            alt="Product"
        >

    </div>


    <!-- ===============================
         PRODUCT DETAILS
    ================================ -->

    <div class="product-details">

        <h1 id="productName"></h1>

        <p id="productDescription"></p>

        <h2 id="productPrice"></h2>

        <hr>


        <!-- ===============================
             STORAGE
        ================================ -->

        <div class="option-section">

            <h3>Storage</h3>

            <div id="storageOptions"></div>

        </div>


<!-- ===============================
     CONDITION
================================ -->

<div class="option-section">

    <h3>Condition</h3>

    <div id="conditionOptions"></div>

</div>
        <!-- ===============================
             COLOUR
        ================================ -->

        <div class="option-section">

            <h3>Colour</h3>

            <div id="colourOptions"></div>

        </div>


        <!-- ===============================
             ACCESSORIES
        ================================ -->

        <div class="option-section">

            <h3>Accessories</h3>

            <div
                id="accessoryOptions"
                class="accessories-grid"
            ></div>

        </div>


        <!-- ===============================
             ACTION BUTTONS
        ================================ -->

        <button
            type="button"
            id="addToCartBtn"
            class="hero-btn"
        >
            Add To Cart
        </button>


        <button
            type="button"
            id="installmentBtn"
            class="installment-btn"
        >
            Apply for Installment
        </button>


        <!-- ===============================
             PRODUCT INFORMATION
        ================================ -->

        <div class="product-info-box">


            <div class="info-item">

                <span class="icon">
                    🛡️
                </span>

                <div>

                    <h4>
                        Official Warranty
                    </h4>

                    <p>
                        12 Months Manufacturer Warranty
                    </p>

                </div>

            </div>


            <div class="info-item">

                <span class="icon">
                    🔄
                </span>

                <div>

                    <h4>
                        Easy Returns
                    </h4>

                    <p>
                        Return within 7 days if the product is defective.
                    </p>

                </div>

            </div>


            <div class="info-item">

                <span class="icon">
                    🚚
                </span>

                <div>

                    <h4>
                        Delivery
                    </h4>

                    <p>
                        Delivery available across Tanzania.
                    </p>

                </div>

            </div>


            <div class="info-item">

                <span class="icon">
                    🔒
                </span>

                <div>

                    <h4>
                        Secure Payment
                    </h4>

                    <p>
                        100% Secure Checkout.
                    </p>

                </div>

            </div>


        </div>

    </div>

</main>


<!-- ===============================
     JAVASCRIPT
================================ -->

<script src="js/apple.js"></script>
<script src="js/samsung.js"></script>
<script src="js/pixel.js"></script>
<script src="js/accessories.js"></script>
<script src="js/audio.js"></script>
<script src="js/products.js"></script>
<script src="js/product.js"></script>

</body>

</html>
