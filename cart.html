<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - Mwashi Gadgets</title>

    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="cart-header">

    <div class="header-content">

        <h1>🛒 Your Shopping Cart</h1>

        <p>
            Review your gadgets before completing your order.
        </p>

    </div>

</header>

<main class="cart-page">

<section class="cart-items-section">

 <div class="section-title">

 <h2>Your Items</h2>

</div>

    <div id="cart-items">

        <!-- Cart items generated by JS -->

    </div>

</section>

<aside class="cart-summary">

    <h2>Order Summary</h2>

    <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">TZS 0</strong>
    </div>

    <div class="summary-row">
        <span>Delivery</span>
        <strong>Free</strong>
    </div>

    <div class="summary-row total">
        <span>Total</span>
        <strong id="cart-total">TZS 0</strong>
    </div>

    <!-- Customer Details Form -->
    <div class="checkout-form">
        <h3>Customer Details</h3>

        <input type="text" id="customer-name" placeholder="Your Full Name" required>

        <input type="tel" id="customer-phone" placeholder="Phone Number (e.g. 07XXXXXXXX)" required>

        <textarea id="customer-note" placeholder="Any additional notes (optional)"></textarea>
    </div>

    <button onclick="checkoutWhatsApp()" class="checkout-btn">
        💬 Checkout on WhatsApp
    </button>

    <div class="trust-info">
        <div class="trust-item">✅ Genuine Devices</div>
        <div class="trust-item">🔒 Secure Ordering</div>
        <div class="trust-item">🚚 Fast Delivery</div>
    </div>

</aside>

</main>

<script src="js/apple.js"></script>
<script src="js/samsung.js"></script>
<script src="js/pixel.js"></script>
<script src="js/accessories.js"></script>
<script src="js/audio.js"></script>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
