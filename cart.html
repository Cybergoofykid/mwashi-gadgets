<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Shopping Cart - Mwashi Gadgets</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="cart-header">

    <div class="header-content">

        <h1>
            🛒 Your Shopping Cart
        </h1>

        <p>
            Review your gadgets before completing your order.
        </p>

    </div>

</header>



<main class="cart-page">


    <!-- =================================================
         CART ITEMS
    ================================================== -->

    <section class="cart-items-section">

        <div class="section-title">

            <h2>
                Your Items
            </h2>

        </div>


        <div id="cart-items">

            <!-- Cart items generated by cart.js -->

        </div>

    </section>



    <!-- =================================================
         CART SUMMARY
    ================================================== -->

    <aside class="cart-summary">

        <h2>
            Order Summary
        </h2>


        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                TZS 0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Delivery
            </span>

            <strong>
                Free
            </strong>

        </div>


        <div class="summary-row total">

            <span>
                Total
            </span>

            <strong id="cart-total">
                TZS 0
            </strong>

        </div>



        <!-- =================================================
             CUSTOMER DETAILS
        ================================================== -->

        <div class="checkout-form">

            <h3>
                Customer Details
            </h3>


            <input
                type="text"
                id="customer-name"
                placeholder="Your Full Name"
            >


            <input
                type="tel"
                id="customer-phone"
                placeholder="Phone Number (e.g. 07XXXXXXXX)"
            >


            <textarea
                id="customer-note"
                placeholder="Any additional notes (optional)"
            ></textarea>

        </div>



        <!-- =================================================
             CHECKOUT
        ================================================== -->

        <button
            type="button"
            onclick="checkoutWhatsApp()"
            class="checkout-btn"
        >

            💬 Checkout on WhatsApp

        </button>



        <!-- =================================================
             TRUST
        ================================================== -->

        <div class="trust-info">

            <div class="trust-item">
                ✅ Genuine Devices
            </div>

            <div class="trust-item">
                🔒 Secure Ordering
            </div>

            <div class="trust-item">
                🚚 Fast Delivery
            </div>

        </div>


    </aside>


</main>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin/config.js"></script>

<script src="admin/supabase-client.js"></script>


<!-- =====================================================
     CART
====================================================== -->

<script src="js/cart.js"></script>


</body>

</html>
